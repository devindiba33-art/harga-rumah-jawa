<style>

:root[data-theme="dark"]{--bg:#0F1826;--surf:#172337;--ink:#E6EDF5;--mute:#93A3B8;--line:#2A3A52;--teal:#4FC3CD;--tealsoft:#1F4A55;--amber:#E7A94A;color-scheme:dark}

.dr{display:grid;grid-template-columns:minmax(120px,190px) 1fr 90px;gap:12px;align-items:center;padding:7px 0;font-size:.95rem}

.dr em{font-style:normal;text-align:right;color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{position:sticky;top:0;background:var(--surf);cursor:pointer;font-weight:600}
select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:10px}
select:focus-visible,th:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
footer{color:var(--mute);font-size:.85rem;margin-top:40px}
</style></head><body><main>
<h1>Range harga rumah di Pulau Jawa</h1>
<p class="sub" id="sub"></p>
<section class="card" aria-label="Range harga keseluruhan">

<div class="track" id="hero"></div>

<p id="notes" style="margin:14px 0 0;font-size:.95rem"></p>
</section>
<h2>Range per provinsi</h2>
<div class="card" id="prov"></div>
<h2>Sebaran properti per kelompok harga</h2>
<div class="card" id="dist"></div>
<h2>Per kota / kabupaten</h2>
<div class="card"><label for="f">Provinsi </label><select id="f"></select>
<div class="scroll"><table id="t"><thead></thead><tbody></tbody></table></div></div>

function track(el,min,max,q1,q3,med,p5,p95){
 const seg=(a,b,c)=>`<div class="seg" style="left:${pct(a)}%;width:${Math.max(pct(b)-pct(a),.8)}%;background:${c}"></div>`;
